<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TL-MR6500v Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="login-card">
      <h1>TL-MR6500v</h1>
      <p class="muted" data-i18n="app.subtitle"></p>
      <label><span data-i18n="login.username"></span> <input name="username" autocomplete="username" value="admin" required></label>
      <label><span data-i18n="login.password"></span> <input name="password" type="password" autocomplete="current-password" required autofocus></label>
      <p id="login-error" class="error-text" role="alert"></p>
      <button type="submit" class="primary" data-i18n="login.submit"></button>
      <label><span data-i18n="lang.label"></span> <select class="lang-select"></select></label>
    </form>
  </main>

  <div id="app-view" hidden>
    <header class="topbar">
      <a class="brand" href="#/"><h1>TL-MR6500v</h1></a>
      <span id="router-pill" class="pill">—</span>
      <span class="spacer"></span>
      <button id="poll-now" type="button" data-i18n="poll.now"></button>
      <a id="nav-main" class="icon-btn" href="#/" aria-current="page" data-i18n-label="nav.home" data-i18n-title="nav.home"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M3 9.5 10 3l7 6.5V17h-4.5v-5h-5v5H3z"/></svg></a>
      <a id="nav-logs" class="icon-btn" href="#/logs" data-i18n-label="tab.logs" data-i18n-title="tab.logs"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="3" y="2.5" width="14" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 7h7M6.5 10h7M6.5 13h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span id="log-badge" class="count-badge" hidden></span></a>
      <a id="nav-settings" class="icon-btn" href="#/settings" data-i18n-label="tab.settings" data-i18n-title="tab.settings"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M8.4 2.5h3.2l.5 2.1 1.5.9 2.1-.7 1.6 2.8-1.6 1.5v1.8l1.6 1.5-1.6 2.8-2.1-.7-1.5.9-.5 2.1H8.4l-.5-2.1-1.5-.9-2.1.7-1.6-2.8 1.6-1.5V8.9L2.7 7.4l1.6-2.8 2.1.7 1.5-.9z"/><circle cx="10" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></a>
      <button id="logout" type="button" data-i18n="logout"></button>
      <div id="sweep" class="sweep" aria-hidden="true"></div>
    </header>

    <main id="page-main">
      <div id="error-banner" class="banner" hidden>
        <a id="banner-text" href="#/logs"></a>
        <button id="banner-ack" type="button" class="banner-btn" hidden data-i18n="err.markRead"></button>
      </div>

      <section id="status-band" class="band" data-state="unknown">
        <div class="band-main">
          <div id="signal" class="bars" role="img"><i></i><i></i><i></i><i></i></div>
          <div>
            <p id="hero-main" class="hero-main"></p>
            <p id="hero-sub" class="hero-sub"></p>
          </div>
        </div>
        <dl id="band-network" class="band-group"></dl>
        <dl id="band-poll" class="band-group"></dl>
        <dl id="band-push" class="band-group"></dl>
        <button id="band-toggle" type="button" class="band-toggle" aria-expanded="false" aria-controls="band-details"></button>
        <dl id="band-details" class="band-details" hidden></dl>
      </section>

      <section class="panel">
        <h2 id="messages-top" class="page-title"><span data-i18n="tab.messages"></span> <span id="messages-count" class="muted"></span></h2>
      <form id="search-form" class="filter-bar">
        <label class="search-field">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="search-keyword" type="search" autocomplete="off" data-i18n-placeholder="search.keyword" data-i18n-label="search.keyword">
        </label>
        <div class="range">
          <label><span data-i18n="search.from"></span><input id="search-from" type="datetime-local"></label>
          <i aria-hidden="true"></i>
          <label><span data-i18n="search.to"></span><input id="search-to" type="datetime-local"></label>
        </div>
        <button id="search-reset" type="reset" class="reset" hidden data-i18n="search.clear"></button>
      </form>
      <div class="tool-row">
        <p class="small muted"><b id="search-count" class="count"></b><span data-i18n="search.hint"></span></p>
        <div class="records">
          <span id="import-msg" class="small muted" role="status"></span>
          <button id="import-existing" type="button" data-i18n="msg.import"></button>
          <button id="clear-messages" type="button" data-i18n="msg.clear" data-i18n-title="msg.clearHint"></button>
        </div>
      </div>
      <div id="messages-list" class="messages"></div>
      <p id="messages-empty" class="muted" hidden data-i18n="msg.empty"></p>
      <p id="messages-nomatch" class="muted" hidden data-i18n="search.none"></p>
      <nav id="pager" class="pager" hidden>
        <label class="page-size"><span data-i18n="page.size"></span>
          <select id="page-size"></select></label>
        <span id="page-range" class="small muted"></span>
        <span id="page-loaded" class="small muted" hidden>
          <span id="page-loaded-text"></span>
          <button id="messages-more" type="button" class="link" data-i18n="msg.more"></button>
        </span>
        <div id="page-nav" class="page-nav" role="group"></div>
      </nav>
      </section>
    </main>

    <main id="page-logs" class="panel" hidden>
      <a class="back" href="#/" data-i18n="nav.back"></a>
      <h2 class="page-title" data-i18n="tab.logs"></h2>
      <div class="toolbar">
        <label><span data-i18n="log.level"></span>
          <select id="log-level">
            <option value="INFO" data-i18n="log.all"></option>
            <option value="WARNING" data-i18n="log.warn"></option>
            <option value="ERROR" data-i18n="log.error"></option>
          </select>
        </label>
        <button id="ack-errors" type="button" data-i18n="log.markRead"></button>
        <span id="ack-note" class="small muted" role="status"></span>
      </div>
      <div id="log-list" class="logs"></div>
    </main>

    <main id="page-settings" class="panel" hidden>
      <a class="back" href="#/" data-i18n="nav.back"></a>
      <h2 class="page-title" data-i18n="tab.settings"></h2>
      <form id="settings-form" class="settings">
        <label class="field">
          <span data-i18n="lang.label"></span>
          <select class="lang-select"></select>
          <small class="muted" data-i18n="lang.hint"></small>
        </label>
        <label class="field">
          <span data-i18n="set.interval"></span>
          <input name="poll_interval_seconds" type="number" min="5" max="3600" step="1" required>
          <small class="muted" data-i18n="set.intervalHint"></small>
        </label>
        <label class="check">
          <input name="kick_existing_login" type="checkbox">
          <span><span data-i18n="set.kick"></span>
            <small class="muted" data-i18n="set.kickHint"></small></span>
        </label>
        <label class="check">
          <input name="allow_lan_access" type="checkbox">
          <span><span data-i18n="set.lan"></span>
            <small class="muted" data-i18n="set.lanHint"></small></span>
        </label>
        <label class="check">
          <input name="notify_errors" type="checkbox">
          <span><span data-i18n="set.notify"></span>
            <small class="muted" data-i18n="set.notifyHint"></small></span>
        </label>
        <label class="check">
          <input name="allow_edit_messages" type="checkbox">
          <span><span data-i18n="set.edit"></span>
            <small class="muted" data-i18n="set.editHint"></small></span>
        </label>
        <p id="settings-msg" class="small" role="status"></p>
        <button type="submit" class="primary" data-i18n="set.save"></button>
      </form>
    </main>

    <button id="to-top" type="button" class="to-top" hidden data-i18n-label="nav.top" data-i18n-title="nav.top"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M10 16V4M4.5 9.5 10 4l5.5 5.5"/></svg></button>
  </div>

  <dialog id="password-dialog">
    <form method="dialog">
      <h2 data-i18n="pw.title"></h2>
      <p class="small muted" data-i18n="pw.hint"></p>
      <label><span data-i18n="login.password"></span>
        <input id="password-input" type="password" autocomplete="current-password" required></label>
      <div class="dialog-actions">
        <button type="submit" value="ok" class="primary" data-i18n="pw.submit"></button>
        <button type="submit" value="cancel" formnovalidate data-i18n="dlg.cancel"></button>
      </div>
    </form>
  </dialog>

  <dialog id="delete-dialog" class="danger-dialog">
    <form method="dialog">
      <h2 data-i18n="del.title"></h2>
      <p id="delete-summary" class="small muted"></p>
      <p data-i18n="del.body"></p>
      <div class="dialog-actions">
        <button type="submit" value="ok" class="danger primary" data-i18n="del.confirm"></button>
        <button type="submit" value="cancel" autofocus data-i18n="dlg.cancel"></button>
      </div>
    </form>
  </dialog>

  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
