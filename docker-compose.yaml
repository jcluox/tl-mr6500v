services:
  tl6500v:
    build: .
    container_name: tl6500v
    env_file: .env
    ports:
      - "127.0.0.1:6500:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    # For development: `docker compose watch` updates the container when files change (plain `up -d` is not affected)
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./pyproject.toml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
